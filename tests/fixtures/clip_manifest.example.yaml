# Example clip manifest (committed template — the binaries are gitignored).
#
# This is the SCHEMA/EXAMPLE. The real `clip_manifest.yaml` is generated by the
# cataloguer at ingest time:  python tools/catalog_clips.py <footage_dir>
#
# Each entry maps a clip (path RELATIVE to tests/fixtures/) to its discipline, the
# checklist conditions it exercises, provenance (source + license, documented in
# README.md), and opencv-probed metadata. Later phases query this via
# segugio.fixtures.select_clips(...) / coverage_report(...).
#
# Condition checklist (both disciplines): multi_dog, handler_prominent,
#   tunnel_contact_occlusion, jump_sprint_blur, distant, backlit_dusk,
#   midfield_equidistant.

clips:
  - file: disc_dog/toss_fetch_multidog_01.mp4
    discipline: disc_dog
    event: distance_accuracy
    conditions: [multi_dog, handler_prominent, distant]
    source: user_footage
    license: user_consent_README
    notes: "two dogs warming up ringside; competitor downfield"
    metadata: { width: 1920, height: 1080, fps: 29.97, frames: 1234, duration_s: 41.2 }

  - file: disc_dog/freestyle_backlit_01.mp4
    discipline: disc_dog
    event: freestyle
    conditions: [backlit_dusk, jump_sprint_blur]
    source: pexels
    license: cc0
    notes: "low evening sun behind the dog; high-drive catch leaps"
    metadata: { width: 3840, height: 2160, fps: 25.0, frames: 750, duration_s: 30.0 }

  - file: agility/run_tunnel_01.mp4
    discipline: agility
    event: agility_standard
    conditions: [tunnel_contact_occlusion, midfield_equidistant]
    source: user_footage
    license: user_consent_README
    notes: "dog enters tunnel mid-course; equidistant from two camera positions"
    metadata: { width: 1920, height: 1080, fps: 30.0, frames: 900, duration_s: 30.0 }
